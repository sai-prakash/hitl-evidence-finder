<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#efe8dc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1a1f2c; }
      .sub { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5c667a; }
      .body { font: 400 13.5px "IBM Plex Serif", Georgia, serif; fill: #2a3140; }
      .meta { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7a8499; }
      .badge { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #3d6fff; }
    </style>
  </defs>
  <rect width="640" height="820" fill="#0b0d12"/>
  <rect x="28" y="28" width="584" height="764" rx="8" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="6" height="764" fill="#5b8cff"/>
  <text x="48" y="64" class="badge">PDF PAGE · DEMO</text>
  <text x="48" y="92" class="title">Climate Brief · Arctic Sea Ice</text>
  <text x="48" y="112" class="sub">Demo corpus · public-domain style science summary</text>
  <line x1="48" y1="124" x2="580" y2="124" stroke="#d9d0c0" stroke-width="1"/>
  <text x="48" y="118" class="body">Satellite observations since 1979 show a long-term decline in Arctic</text>
<text x="48" y="140" class="body">September sea-ice extent of approximately 13% per decade relative to the</text>
<text x="48" y="162" class="body">1981–2010 mean. Multi-year ice has thinned substantially, and the ice-free</text>
<text x="48" y="184" class="body">season lengthens as melt onset advances and freeze-up delays.</text>
<text x="48" y="220" class="body">Extent alone understates mass loss: ice thickness and volume have fallen</text>
<text x="48" y="242" class="body">faster than area in many assessments. Regional variability remains large,</text>
<text x="48" y="264" class="body">but the multi-decadal trend is robust across independent retrievals.</text>
<text x="48" y="300" class="body">Figure note (demo): schematic extent curve omitted; treat this page as a</text>
<text x="48" y="322" class="body">synthetic PDF raster for embedding retrieval demos only.</text>
  <line x1="48" y1="760" x2="580" y2="760" stroke="#d9d0c0" stroke-width="1"/>
  <text x="48" y="780" class="meta">Page 1 · HITL Evidence Finder sample · not an official agency report</text>
</svg>
