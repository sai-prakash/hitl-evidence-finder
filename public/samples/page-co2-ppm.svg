<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="100%" stop-color="#efe8dc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1a1f2c; }
      .sub { font: 500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #5c667a; }
      .body { font: 400 13.5px "IBM Plex Serif", Georgia, serif; fill: #2a3140; }
      .meta { font: 500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill: #7a8499; }
      .badge { font: 600 10px Inter, ui-sans-serif, system-ui, sans-serif; fill: #3d6fff; }
    </style>
  </defs>
  <rect width="640" height="820" fill="#0b0d12"/>
  <rect x="28" y="28" width="584" height="764" rx="8" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="28" y="28" width="6" height="764" fill="#5b8cff"/>
  <text x="48" y="64" class="badge">PDF PAGE · DEMO</text>
  <text x="48" y="92" class="title">Atmosphere · Carbon Dioxide</text>
  <text x="48" y="112" class="sub">Demo corpus · Mauna Loa–style narrative for demos</text>
  <line x1="48" y1="124" x2="580" y2="124" stroke="#d9d0c0" stroke-width="1"/>
  <text x="48" y="118" class="body">Continuous in-situ measurements of atmospheric carbon dioxide show a clear</text>
<text x="48" y="140" class="body">seasonal cycle superimposed on a rising multi-decade trend. Recent annual</text>
<text x="48" y="162" class="body">means at reference observatories have exceeded 420 parts per million (ppm),</text>
<text x="48" y="184" class="body">well above pre-industrial levels near 280 ppm.</text>
<text x="48" y="220" class="body">The growth rate varies year to year with ENSO and land-biosphere fluxes,</text>
<text x="48" y="242" class="body">but the long-term increase tracks cumulative fossil and land-use emissions.</text>
<text x="48" y="264" class="body">Independent flask networks and satellite retrievals corroborate the surface</text>
<text x="48" y="286" class="body">record within stated uncertainties.</text>
<text x="48" y="322" class="body">Use this page only as a retrieval target in the HITL Evidence Finder demo.</text>
  <line x1="48" y1="760" x2="580" y2="760" stroke="#d9d0c0" stroke-width="1"/>
  <text x="48" y="780" class="meta">Page 3 · HITL Evidence Finder sample · synthetic demo document</text>
</svg>
